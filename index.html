<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium Pass</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: Arial, sans-serif; }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <h2>Loading Stadium Pass...</h2>
        <p>Connecting to venue network</p>
    </div>
    <script type="text/javascript">
      // 1. Grab the venue ID out of the link parameters immediately
      const urlParams = new URLSearchParams(window.location.search);
      const scannedRestaurantId = urlParams.get('restaurant_id') || 'default_venue';
      
      // 2. Safely store it in browser Session Storage memory
      sessionStorage.setItem('active_venue', scannedRestaurantId);

      // 3. Fire up the native Voiceflow script engine
      (function(d, t) {
          var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
          v.onload = function() {
            window.voiceflow.chat.load({
              verify: { projectID: '6a16b6e49710543c72225ef6' },
              url: 'https://general-runtime.voiceflow.com',
              versionID: 'production',
              layout: 'page' // Forces it full screen on mobile right away
            });
          }
          v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
      })(document, 'script');
    </script>
</body>
</html>
